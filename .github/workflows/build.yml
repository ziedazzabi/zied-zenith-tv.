name: Build Z-Vision

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Android APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception:" build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            grep -A12 "What went wrong" build.log | head -30 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          fi
          exit $code

      - name: Build Samsung (.wgt) and LG (.ipk) TV apps
        working-directory: tv
        env:
          APP_VERSION: 1.0.${{ github.run_number }}
        run: |
          npm ci --no-audit --no-fund
          if ! node scripts/build.mjs > tvbuild.log 2>&1; then head -40 tvbuild.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; fi
          cat tvbuild.log
          npx ares-package dist/webos -o dist

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZVision-${{ github.run_number }}.apk
          cp tv/dist/ZVision.wgt out/ZVision-Samsung-${{ github.run_number }}.wgt
          cp tv/dist/*.ipk out/ZVision-LG-${{ github.run_number }}.ipk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Z-Vision
          path: out/*

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Z-Vision build ${{ github.run_number }}
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
