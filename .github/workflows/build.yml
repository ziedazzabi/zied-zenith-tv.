name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set +e
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|FAILURE|Exception:" build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
            grep -A12 "What went wrong" build.log | head -30 | while IFS= read -r l; do echo "::warning::${l//%/%25}"; done
          fi
          exit $code

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/ZenithTV-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZenithTV-apk
          path: out/*.apk

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zenith TV build ${{ github.run_number }}
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
